mapping_id: abcd_retail
version: "1"
workflow_id: retail_support
workflow_version: "1"
status: provisional
basis: >-
  Explicit flow/subflow taxonomy observed in the official training partition.
  Agent-authored ownership mapping; human review pending. These targets describe
  eventual ownership, not evidence sufficiency in the opening message.
flows:
  - flow: account_access
    subflows: [recover_username, recover_password, reset_2fa]
    target_queue: account
    rationale: Credentials and account access belong to account support.
  - flow: manage_account
    subflows: [status_credit_missing, status_shipping_question, manage_change_phone,
      status_service_added, manage_change_name, manage_payment_method,
      manage_change_address, status_service_removed]
    target_queue: account
    overrides:
      status_credit_missing: billing_subscriptions
      status_shipping_question: orders_delivery
      status_service_added: billing_subscriptions
      status_service_removed: billing_subscriptions
    rationale: >-
      Profile and stored payment-method changes stay with account support.
      Missing credit and service changes go to billing/subscriptions;
      shipping questions go to orders/delivery.
  - flow: order_issue
    subflows: [status_quantity, status_payment_method, status_mystery_fee,
      manage_downgrade, status_delivery_time, manage_create, manage_cancel,
      manage_upgrade, status_delivery_date]
    target_queue: orders_delivery
    overrides:
      status_mystery_fee: billing_subscriptions
    rationale: Order details and changes belong to orders; unexplained fees belong to billing.
  - flow: product_defect
    subflows: [return_size, refund_status, refund_update, refund_initiate, return_color, return_stain]
    target_queue: returns_refunds
    rationale: Product return and refund workflows belong to returns/refunds.
  - flow: purchase_dispute
    subflows: [mistimed_billing_already_returned, out_of_stock_general,
      bad_price_competitor, mistimed_billing_never_bought, out_of_stock_one_item,
      bad_price_yesterday, promo_code_invalid, promo_code_out_of_date]
    target_queue: billing_subscriptions
    overrides:
      mistimed_billing_already_returned: returns_refunds
      out_of_stock_general: product_policy
      out_of_stock_one_item: product_policy
    rationale: >-
      Price, charge, and promotional disputes go to billing. Charges for an
      already returned purchase go to returns/refunds. Stock availability
      belongs to product/policy. These boundary choices need human review.
  - flow: shipping_issue
    subflows: [manage, status, missing, cost]
    target_queue: orders_delivery
    rationale: Shipment changes, tracking, missing shipments, and shipping costs.
  - flow: single_item_query
    subflows: [jacket_how_2, jeans_how_4, jeans_how_1, shirt_other_2,
      jeans_how_2, jeans_other_2, jacket_other_3, jeans_other_3, jeans_other_1,
      boots_other_1, boots_how_1, shirt_how_1, jacket_how_4, jeans_other_4,
      jacket_how_1, boots_other_2, boots_how_2, shirt_other_4, shirt_how_3,
      boots_other_4, jeans_how_3, jacket_other_1, jacket_other_4, shirt_how_4,
      shirt_other_1, boots_how_3, boots_other_3, jacket_other_2, jacket_how_3,
      boots_how_4, shirt_how_2, shirt_other_3]
    target_queue: product_policy
    rationale: Item information and usage questions belong to product support.
  - flow: storewide_query
    subflows: [timing_4, pricing_3, timing_2, pricing_1, policy_2, pricing_2,
      membership_2, timing_3, membership_3, policy_1, policy_3, membership_1,
      pricing_4, timing_1, membership_4, policy_4]
    target_queue: product_policy
    rationale: General hours, pricing, policies, and membership information.
  - flow: subscription_inquiry
    subflows: [manage_extension, status_due_date, manage_pay_bill, status_questions,
      status_due_amount, manage_dispute_bill]
    target_queue: billing_subscriptions
    rationale: Subscription billing, due dates, payment, and billing disputes.
  - flow: troubleshoot_site
    subflows: [shopping_cart, credit_card, slow_speed, search_results]
    target_queue: technical_support
    rationale: Website faults, including checkout/card technical problems.
