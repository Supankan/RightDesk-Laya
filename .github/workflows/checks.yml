name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra baseline --extra data --extra ui
      - run: uv run --no-sync ruff check src tests apps scripts
      - run: uv run --no-sync ruff format --check src tests apps scripts
      - run: uv run --no-sync pytest -q
      # Tests use local fixtures/fake SDK responses; no dataset or model downloads.
